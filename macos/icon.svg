<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Signalbox: a signal head, steel (working) above champagne (needs you), on warm black. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2927"/>
      <stop offset="1" stop-color="#0E0E0F"/>
    </linearGradient>
    <radialGradient id="steel">
      <stop offset="0" stop-color="#9DB3C9" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9DB3C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="champagne">
      <stop offset="0" stop-color="#D9B77E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#D9B77E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity=".07" stroke-width="2"/>
  <rect x="392" y="222" width="240" height="580" rx="120" fill="#08080A" stroke="#3A3936" stroke-width="8"/>
  <circle cx="512" cy="352" r="150" fill="url(#steel)"/>
  <circle cx="512" cy="672" r="150" fill="url(#champagne)"/>
  <circle cx="512" cy="352" r="66" fill="#9DB3C9"/>
  <circle cx="512" cy="512" r="66" fill="#343438" stroke="#3A3936" stroke-width="6"/>
  <circle cx="512" cy="672" r="66" fill="#D9B77E"/>
  <circle cx="490" cy="330" r="16" fill="#FFFFFF" fill-opacity=".5"/>
  <circle cx="490" cy="650" r="16" fill="#FFFFFF" fill-opacity=".45"/>
</svg>
